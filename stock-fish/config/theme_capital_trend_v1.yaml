strategy_id: THEME_CAPITAL_TREND_V1
version: 1
specification_name: "StockRecommendation theme-capital-bull-trend strategy"
parameter_status: INITIAL_HYPOTHESIS_NOT_MARKET_VALIDATED
parameter_status_label_zh: "尚未验证"
traceability:
  replaces_prior_draft: "板块资金趋势筛选与落选反思"
  prior_draft_execution: REPLACED_NOT_MERGED
  preserves_existing_strategies:
    - DAILY_V1
    - PV_OBSERVATION_V1
    - PV_FOCUS_PREVIEW_V0.1
    - DNA_RERANK_V1
    - THEME_CONTEXT_V1
  acceptance_policy: "Specific named stocks entering the list are not acceptance criteria."
hard_requirements:
  qualified_universe:
    exchanges: [SSE, SZSE]
    board: MAIN
    security_type: A_COMMON
  statuses:
    pass: PASS
    fail: FAIL
    unknown: UNKNOWN
    unknown_policy: "UNKNOWN is never neutral and never imputed; formal output requires every required condition to PASS."
  amount:
    observation_day_min_cny_inclusive: 500000000
  turnover:
    observation_day_min_fraction_inclusive: 0.07
    definition: "ordinary turnover = volume_shares / then-valid float_shares, stored as turnover_fraction when provider verified"
  trend:
    moving_average_bullish_arrangement_required: true
    close_below_ma120_or_ma250_excluded: true
  pullback:
    allow_short_pullback_sessions_inclusive: [1, 3]
  theme:
    required: true
    no_sector_or_theme_linkage_evidence_blocks_formal_list: true
  capital:
    required: true
    no_active_sector_capital_evidence_blocks_formal_list: true
  list_count:
    fixed_count: null
    zero_list_allowed: true
  replay:
    include_rejected_exited_and_bad_samples: true
research_seed_parameters:
  note: "These are implementation seed parameters for this version, not user-originated rules and not verified optimum."
  parameter_status_label_zh: "尚未验证"
  moving_averages:
    windows: [5, 10, 20, 60, 120, 250]
    price_field: comparable_close
    comparable_basis_policy: SAME_BASIS_WITHIN_WINDOW
    bullish_arrangement: [5, 10, 20, 60, 120, 250]
    close_minimums: [60, 120, 250]
  shapes:
    trend_run:
      require_close_at_or_above_ma5: true
    pullback:
      require_close_below_ma5: true
      below_ma5_sessions_inclusive: [1, 3]
      max_distance_to_ma_5_10_20_fraction_inclusive: 0.03
      require_arrangement_through_segment: true
      require_segment_closes_at_or_above_ma_60_120_250: true
      min_close_vs_ma20_fraction_inclusive: 0.97
      excluded_seed_filters_not_used:
        - daily_down_candle
        - close_location_low
        - amount_ratio_below_1_2
  theme_linkage:
    allowed_theme_types: [EVENT, INDUSTRY]
    peer_excludes_self: true
    min_other_valid_members_inclusive: 5
    min_peer_return_coverage_fraction_inclusive: 0.80
    peer_ret5_median_min_exclusive: 0
    peer_up_fraction_min_inclusive: 0.60
    peer_ret5_ge_10pct_count_min_inclusive: 2
    require_peer_ret5_median_at_or_above_mainboard_median: true
    descriptive_windows: [1, 3, 5]
    multi_theme_order: [peer_ret5_median_desc, theme_id_asc]
  capital_linkage:
    lookback_sessions: 5
    recent_activity_sessions: 3
    peers_exclude_self: true
    min_other_members_with_classified_active_money_events_inclusive: 2
    min_dedup_classified_buy_amount_cny_inclusive: 100000000
    require_dedup_net_amount_positive: true
    min_single_classified_buy_amount_cny_inclusive: 20000000
    classified_source_layers:
      - SUPPLIER_CLASSIFIED_ACTIVE_SEAT
      - SUPPLIER_CLASSIFIED_SEAT
      - CLASSIFIED_ACTIVE_MONEY_SEAT
    proxy_source_layers:
      - CAPITAL_PROXY
      - LARGE_ORDER_PROXY
      - MAIN_NET_FLOW_PROXY
    proxy_only_label: CAPITAL_PENDING_VERIFICATION
  ranking:
    complex_new_score: false
    reference_score: "PV continuous percentile score over computable PV factors, without PV A/R screen and without focus filters."
    tie_break: instrument_id_asc
  comparisons:
    - PV_OBSERVATION_V1
    - PV_FOCUS_PREVIEW_V0.1
    - THEME_CAPITAL_TREND_TECHNICAL_ONLY_V1
    - THEME_CAPITAL_TREND_V1
    - SIMPLE_TREND_TEMPLATE_REFERENCE_V1
open_source_references:
  accessed_on: "2026-09-07"
  notes: "References inform comparison only; no code is copied and no external rule is adopted as validated market edge."
  items:
    - name: myhhub/stock
      url: https://github.com/myhhub/stock
      role: "Open-source A-share data/strategy reference for source separation and reproducibility comparison."
    - name: tkfy920/qstock
      url: https://github.com/tkfy920/qstock
      role: "Open-source Chinese market data helper reference; not a strategy oracle."
    - name: Microsoft Qlib workflow documentation
      url: https://qlib.readthedocs.io/en/latest/component/workflow.html
      role: "Experiment tracking and workflow reference."
    - name: Freqtrade lookahead analysis
      url: https://www.freqtrade.io/en/stable/lookahead-analysis/
      role: "Look-ahead-bias diagnostic reference."
    - name: Tushare Pro documentation
      url: https://tushare.pro/document/2?doc_id=106
      role: "Public API documentation reference for trade-date and data-field discipline."
    - name: AkShare documentation
      url: https://akshare.akfamily.xyz/data/stock/stock.html
      role: "Public data-interface documentation reference."
