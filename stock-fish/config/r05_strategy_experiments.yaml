# R05新增实验的预注册种子配置。不是经市场验证的最优参数。
# 公式说明只能映射到受控数值函数；不得eval此文件中的字符串。
spec_version: R05_EXPERIMENT_SEEDS_V1
parameter_status: INITIAL_HYPOTHESIS_NOT_MARKET_VALIDATED
purpose: MAINBOARD_RESEARCH_ONLY
execution_enabled: false
account_required: false
universe:
  exchanges: [SSE, SZSE]
  board: MAIN
  security_type: A_COMMON
  include_st: false
  include_delisting_arrangement: false
  min_listing_exchange_sessions: 60
  quote_coverage_min: 0.98
  incomplete_scope_label: LIMITED_SCOPE
ranking:
  percentile: EMPIRICAL_MIDRANK_V1
  tie_break: instrument_id_ascending
  missing_factor: UNAVAILABLE_NO_IMPUTATION
  full_rank_persisted: true
  display_top_k: 20
baseline:
  strategy_id: YAOGU_V1.1.0
  profile: DAILY_V1
  config_path: config/yaogu_v1.defaults.yaml
  action: FREEZE_CAPTURE_ACTUAL_HASH_DO_NOT_OVERWRITE
strategies:
  PV_OBSERVATION_V1:
    origin: PROJECT_CONTROL_HYPOTHESIS
    requires:
      - current_security_qualification
      - exchange_calendar
      - six_consecutive_sessions_amount
      - comparable_price_basis
      - current_raw_high_low_reference_price
    not_required:
      - limit_events
      - themes
      - funds
      - dragon_tiger_seats
      - auction
      - gene_250_sessions
    lookback_sessions: 6
    amount_ratio_prior_sessions: 5
    min_amount_ratio_inclusive: 1.2
    min_ret5_exclusive: 0.0
    feature_definitions:
      A: amount_T_div_mean_amount_previous_5_sessions_excluding_T
      R: comparable_close_T_div_comparable_close_T_minus_5_minus_1
      H: raw_high_T_minus_raw_low_T_div_reference_prev_close_T
    weights:
      percentile_A: 0.45
      percentile_R: 0.35
      percentile_H: 0.20
    missing_board_label: UNVERIFIED_NOT_ZERO
    tier: RESEARCH_RANK_NOT_DAILY_V1_FOCUS
  DNA_RERANK_V1:
    origin: LIMIT_UP_SNIPER_INSPIRED_ADAPTATION
    source_repository: https://github.com/guoyaohua/limit-up-sniper
    source_path: core/gene_calculator.py
    source_commit: RESOLVE_AND_PIN_BEFORE_IMPLEMENTATION
    base_screen: PV_OBSERVATION_V1
    recompute_pv_percentiles_on_eligible_subset: true
    keep_original_pv_score_separately: true
    history_sessions: 252
    mature_event_window_sessions: 250
    limit_count_window_sessions_including_T: 250
    next_day_result_max_visible_session: T
    min_first_board_attempts: 3
    raw_first_board_seal_rate_gt: 0.70
    wilson_z: 1.959963984540054
    mean_prior_strength: 5.0
    mean_prior_population: SAME_DATE_FIXED_GENE_ELIGIBLE_COHORT_EVENT_WEIGHTED
    gene_weights:
      percentile_wilson_limit_next_close_above_5pct: 0.25
      percentile_wilson_first_sealed_next_close_positive: 0.25
      percentile_wilson_first_touch_sealed: 0.25
      percentile_shrunk_first_attempt_next_open_premium: 0.15
      percentile_limit_close_count: 0.10
    combination:
      pv_score_on_gene_eligible_cohort: 0.60
      gene_score: 0.40
    inherit_exclude_yesterday_limit_up: false
    inherit_broker_or_order_logic: false
    unknown_next_session_result: EXCLUDE_FROM_MATURE_DENOMINATOR
  THEME_CONTEXT_V1:
    origin: PROJECT_ADAPTATION_WITH_VIBE_ASTOCK_CONTEXT_METRICS
    source_repository: https://github.com/simonlin1212/vibe-astock
    source_path: duanxian/emotion_metrics.py
    source_commit: RESOLVE_AND_PIN_BEFORE_IMPLEMENTATION
    base_screen: PV_OBSERVATION_V1
    recompute_pv_percentiles_on_eligible_subset: true
    keep_original_pv_score_separately: true
    min_theme_members: 5
    peer_required_quote_coverage_min: 0.95
    exclude_self_from_peer_statistics: true
    theme_percentile_population: SAME_DATE_FROZEN_VALID_THEMES_LEAVE_TARGET_OUT
    theme_weights:
      percentile_peer_limit_count: 0.40
      percentile_peer_ret5_median: 0.30
      percentile_peer_up_fraction: 0.30
    select_primary_theme: MAX_THEME_SCORE_THEN_THEME_ID_ASC
    combination:
      pv_score_on_theme_eligible_cohort: 0.75
      theme_score: 0.25
    emotion_mode: CONTEXT_AND_STRATIFIED_EVALUATION_NO_NEW_HARD_VETO
    missing_theme: STRATEGY_UNAVAILABLE_NOT_NEUTRAL_IMPUTATION
funds:
  role_in_new_experiments: EVIDENCE_AND_GROUPED_ANALYSIS_ONLY
  preserve_original_daily_funds_variant: true
  infer_real_person_from_seat_without_source: false
comparison:
  top_k: [5, 10, 20]
  horizons_exchange_sessions: [1, 2, 3, 5, 10]
  attempted_initial_historical_sessions: 20
  compare_common_eligibility_separately: true
  compare_overlap_of_selected_winners_only: false
  preserve_all_trials_and_missing_runs: true
  uncertainty_sampling_unit: DATE_BLOCK
  actual_order_assumption: NONE
  same_close_execution_assumption: false
  auto_optimize_parameters: false
