services:
  stockfish:
    build:
      context: .
      dockerfile: Dockerfile
    image: stockfish-core:local
    init: true
    user: "10001:10001"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      STOCK_BACKEND: "advanced"
      STOCKFISH_API_KEY: "${STOCKFISH_API_KEY:?Set a private STOCKFISH_API_KEY before starting the container}"
      STOCKFISH_ALLOWED_HOSTS: "${STOCKFISH_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      STOCKFISH_STATE_DIR: "/app/data/core"
      STOCKFISH_DB_PATH: "/app/data/stockfish.sqlite3"
      QLIB_DATA_DIR: "/app/qlib-data/cn_data"
      QLIB_DATA_PROXY: "${QLIB_DATA_PROXY:-}"
      TUSHARE_TOKEN: "${TUSHARE_TOKEN:-}"
      TUSHARE_PRO_TOKEN: "${TUSHARE_PRO_TOKEN:-}"
    ports:
      - "127.0.0.1:${STOCKFISH_PORT:-8000}:8000"
    volumes:
      - stockfish-state:/app/data
      - stockfish-qlib:/app/qlib-data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/api/health', headers={'Authorization':'Bearer '+os.environ.get('STOCKFISH_API_KEY','')}); urllib.request.urlopen(req, timeout=5).read()\""]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Explicit experimental profile only. Not a dependency of the core; this
  # external image and AGPL/data/service rights are not production-cleared.
  mirofish:
    profiles: ["experimental-mirofish"]
    image: zhuhai123/stockfish-mirofish:latest
    environment:
      OPENAI_API_KEY: "${MIROFISH_OPENAI_API_KEY:-}"
      ZEP_API_KEY: "${MIROFISH_ZEP_API_KEY:-}"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5001:5001"
    volumes:
      - mirofish-uploads:/app/backend/uploads
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

# The legacy bot service has no canonical authenticated publishing adapter.
# Its previous configuration is preserved in review/astra-master/security-starting.
volumes:
  stockfish-state:
  stockfish-qlib:
  mirofish-uploads:
