[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stockfish-live"
version = "0.1.0"
description = "Independent PIT-first intraday market research replay foundation"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10,<3", "pyarrow>=18,<24", "duckdb>=1.2,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
stockfish-live = "stockfish_live.cli:main"

[tool.setuptools.packages.find]
include = ["stockfish_live*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
