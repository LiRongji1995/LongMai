[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "us-equity-quant-system"
version = "0.1.0"
description = "Phase 0 scaffold for a deterministic US equity quantitative trading system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.14,<2", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[project.scripts]
quant-system = "quant_system.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_review_bundle.py" = ["E501", "UP017"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
explicit_package_bases = true
mypy_path = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=quant_system --cov-fail-under=90"
testpaths = ["tests"]
