name: Isolated engineering gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      daily: ${{ steps.scope.outputs.daily }}
      go: ${{ steps.scope.outputs.go }}
      go_core: ${{ steps.scope.outputs.go_core }}
      live: ${{ steps.scope.outputs.live }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 -I -B stock-fish/scripts/engineering_ci_scope_v1.py --base "$BASE_SHA" --head "$HEAD_SHA" --output "$RUNNER_TEMP/scope.json" --github-output "$GITHUB_OUTPUT"
      - name: Inventory release inputs without asserting platform acceptance
        run: python3 -I -B stock-fish/scripts/release_profile_manifest_v1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engineering-scope
          path: ${{ runner.temp }}/scope.json

  daily:
    needs: scope
    if: needs.scope.outputs.daily == 'true'
    # The only existing full hash lock is native macOS x86_64 / CPython 3.12.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify existing locked inputs
        run: python -I -B stock-fish/scripts/release_profile_manifest_v1.py --profile daily-review --target Darwin/x86_64/3.12 --require-hashed-inputs
      - name: Build a new isolated test runtime from unchanged artifact hashes
        run: python -I -B stock-fish/scripts/bootstrap_daily_runtime.py create --destination "$RUNNER_TEMP/TEST_FIXTURE_daily_runtime"
      - name: Run mandatory safety gates and changed tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python -I -B stock-fish/scripts/engineering_ci_scope_v1.py --base "$BASE_SHA" --head "$HEAD_SHA" --output "$RUNNER_TEMP/scope.json"
          "$RUNNER_TEMP/TEST_FIXTURE_daily_runtime/bin/python" -I -B stock-fish/scripts/engineering_ci_scope_v1.py --run-scope "$RUNNER_TEMP/scope.json" --basetemp "$RUNNER_TEMP/TEST_FIXTURE_daily_tests" --junitxml "$RUNNER_TEMP/daily-junit.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: daily-engineering-results
          path: ${{ runner.temp }}/daily-junit.xml
          if-no-files-found: warn

  go:
    needs: scope
    if: needs.scope.outputs.go == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      STOCKFISH_FORMAL_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: python -I -B stock-fish/scripts/bootstrap_daily_runtime.py create --destination "$RUNNER_TEMP/TEST_FIXTURE_oracle_runtime"
      - name: Generate independent Python TEST_FIXTURE oracle
        run: '"$RUNNER_TEMP/TEST_FIXTURE_oracle_runtime/bin/python" -I -B stock-fish-go/tools/oracle.py --output "$RUNNER_TEMP/TEST_FIXTURE_oracle"'
      - name: Formal Go differential, race and vet gates
        working-directory: stock-fish-go
        run: |
          export STOCKFISH_R1_ORACLE="$RUNNER_TEMP/TEST_FIXTURE_oracle"
          go test -race ./... -count=1
          go vet ./...

  go-core:
    needs: scope
    if: needs.scope.outputs.go_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go-core/go.mod
          cache: false
      - working-directory: go-core
        run: |
          go test -race ./... -count=1
          go vet ./...

  live:
    needs: scope
    if: needs.scope.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Isolated version-pinned Live tests (artifact reproducibility remains UNVERIFIED)
        run: |
          python -m venv "$RUNNER_TEMP/TEST_FIXTURE_live_runtime"
          "$RUNNER_TEMP/TEST_FIXTURE_live_runtime/bin/python" -m pip install -r stockfish-live/requirements-test.lock.txt
          "$RUNNER_TEMP/TEST_FIXTURE_live_runtime/bin/python" -I -B stock-fish/scripts/engineering_ci_scope_v1.py --run-live --basetemp "$RUNNER_TEMP/TEST_FIXTURE_live_tests" --junitxml "$RUNNER_TEMP/live-junit.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-engineering-results
          path: ${{ runner.temp }}/live-junit.xml
          if-no-files-found: warn
