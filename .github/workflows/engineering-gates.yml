name: Isolated engineering gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      daily: ${{ steps.scope.outputs.daily }}
      go: ${{ steps.scope.outputs.go }}
      go_core: ${{ steps.scope.outputs.go_core }}
      live: ${{ steps.scope.outputs.live }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 -I -B stock-fish/scripts/engineering_ci_scope_v2.py --base "$BASE_SHA" --head "$HEAD_SHA" --output "$RUNNER_TEMP/scope.json" --github-output "$GITHUB_OUTPUT"
      - name: Inventory release inputs without asserting platform acceptance
        run: python3 -I -B stock-fish/scripts/release_profile_manifest_v1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engineering-scope
          path: ${{ runner.temp }}/scope.json

  daily:
    needs: scope
    if: needs.scope.outputs.daily == 'true'
    # The only existing full hash lock is native macOS x86_64 / CPython 3.12.
    runs-on: macos-15-intel
    timeout-minutes: 45
    # Partition complete modules exactly once; all fixed safety gates remain in
    # the workflow union. Three 45-minute engineering allocations, no business
    # request budget change and no automatic retry.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify existing locked inputs
        run: python -I -B stock-fish/scripts/release_profile_manifest_v1.py --profile daily-review --target Darwin/x86_64/3.12 --require-hashed-inputs
      - name: Observe host launcher identity before creating a runtime
        run: 'python -I -B stock-fish/scripts/native_python_identity_probe_v1.py --cwd "$RUNNER_TEMP" --output "$RUNNER_TEMP/host-native-python-identity.json"'
      - name: Build a new isolated test runtime from unchanged artifact hashes
        run: |
          python -I -B - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import sys

          probe = runpy.run_path("stock-fish/scripts/native_python_identity_probe_v1.py")
          identity = probe["native_executable"]()
          if sys.platform != "darwin" or identity["source"] != "_NSGetExecutablePath":
              raise RuntimeError("CI_NATIVE_MACH_O_REQUIRED")
          native = Path(identity["path"]).resolve(strict=True)
          if not native.is_file() or not os.access(native, os.X_OK):
              raise RuntimeError("CI_NATIVE_INTERPRETER_NOT_EXECUTABLE")
          environment = dict(os.environ)
          environment.pop("__PYVENV_LAUNCHER__", None)
          environment.pop("PYTHONEXECUTABLE", None)
          bootstrap = Path("stock-fish/scripts/bootstrap_ci_native_runtime_v1.py").resolve(strict=True)
          destination = Path(os.environ["RUNNER_TEMP"]) / "TEST_FIXTURE_daily_runtime"
          os.execve(str(native), [str(native), "-I", "-B", str(bootstrap), "create",
                                 "--destination", str(destination)], environment)
          PY
      - name: Observe native child and grandchild identities without normalization
        run: '"$RUNNER_TEMP/TEST_FIXTURE_daily_runtime/bin/python" -I -B stock-fish/scripts/native_python_identity_probe_v1.py --cwd "$RUNNER_TEMP" --output "$RUNNER_TEMP/native-python-identity.json" --require-exact'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-python-identity-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/host-native-python-identity.json
            ${{ runner.temp }}/native-python-identity.json
          if-no-files-found: warn
      - name: Run mandatory safety and dependency-selected specialist gates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python -I -B stock-fish/scripts/engineering_ci_scope_v2.py --base "$BASE_SHA" --head "$HEAD_SHA" --output "$RUNNER_TEMP/scope.json"
          "$RUNNER_TEMP/TEST_FIXTURE_daily_runtime/bin/python" -I -B stock-fish/scripts/engineering_ci_scope_v2.py --run-scope "$RUNNER_TEMP/scope.json" --shard-index "${{ matrix.shard }}" --shard-count 3 --partition-output "$RUNNER_TEMP/partition.json" --basetemp "$RUNNER_TEMP/TEST_FIXTURE_daily_tests" --junitxml "$RUNNER_TEMP/daily-junit.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: daily-engineering-results-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/daily-junit.xml
            ${{ runner.temp }}/partition.json
            ${{ runner.temp }}/scope.json
          if-no-files-found: warn

  go:
    needs: scope
    if: needs.scope.outputs.go == 'true'
    runs-on: macos-15-intel
    # Three separate 45-minute jobs: total allocated ceiling is now 135 minutes.
    # Complete package binaries retain all internal tests and shared lifecycle.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [research, core, remaining]
    env:
      STOCKFISH_FORMAL_ACCEPTANCE: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GO_PACKAGE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: python -I -B stock-fish/scripts/bootstrap_daily_runtime.py create --destination "$RUNNER_TEMP/TEST_FIXTURE_oracle_runtime"
      - name: Generate independent Python TEST_FIXTURE oracle
        run: '"$RUNNER_TEMP/TEST_FIXTURE_oracle_runtime/bin/python" -I -B stock-fish-go/tools/oracle.py --output "$RUNNER_TEMP/TEST_FIXTURE_oracle"'
      - name: Discover complete package partition and run race plus vet
        run: |
          export STOCKFISH_R1_ORACLE="$RUNNER_TEMP/TEST_FIXTURE_oracle"
          "$RUNNER_TEMP/TEST_FIXTURE_oracle_runtime/bin/python" -I -B stock-fish/scripts/engineering_go_packages_v1.py --group "$GO_PACKAGE_GROUP" --destination "$RUNNER_TEMP/TEST_FIXTURE_go_$GO_PACKAGE_GROUP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: go-package-${{ matrix.group }}-results
          path: ${{ runner.temp }}/TEST_FIXTURE_go_${{ matrix.group }}/
          if-no-files-found: warn

  go-core:
    needs: scope
    if: needs.scope.outputs.go_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go-core/go.mod
          cache: false
      - working-directory: go-core
        run: |
          go test -race ./... -count=1
          go vet ./...

  live:
    needs: scope
    if: needs.scope.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Isolated version-pinned Live tests (artifact reproducibility remains UNVERIFIED)
        run: |
          python -m venv "$RUNNER_TEMP/TEST_FIXTURE_live_runtime"
          "$RUNNER_TEMP/TEST_FIXTURE_live_runtime/bin/python" -m pip install -r stockfish-live/requirements-test.lock.txt
          mkdir "$RUNNER_TEMP/TEST_FIXTURE_live_wheels"
          "$RUNNER_TEMP/TEST_FIXTURE_live_runtime/bin/python" -I -B -m pip wheel --no-deps --no-cache-dir --wheel-dir "$RUNNER_TEMP/TEST_FIXTURE_live_wheels" ./stockfish-live
          "$RUNNER_TEMP/TEST_FIXTURE_live_runtime/bin/python" -I -B -m pip install --no-deps --no-index "$RUNNER_TEMP/TEST_FIXTURE_live_wheels"/stockfish_live-*.whl
          "$RUNNER_TEMP/TEST_FIXTURE_live_runtime/bin/python" -I -B -m pip check
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/TEST_FIXTURE_live_runtime/bin/python" -I -B -c "import stockfish_live, sys; from pathlib import Path; assert Path(stockfish_live.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); print(stockfish_live.__file__)")
          "$RUNNER_TEMP/TEST_FIXTURE_live_runtime/bin/python" -I -B stock-fish/scripts/engineering_ci_scope_v2.py --run-live --basetemp "$RUNNER_TEMP/TEST_FIXTURE_live_tests" --junitxml "$RUNNER_TEMP/live-junit.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-engineering-results
          path: ${{ runner.temp }}/live-junit.xml
          if-no-files-found: warn
